services:
  api:
    image: devzevitor/hackton-javascript-intermediario:latest
    container_name: professor-mensuring-api

    ports:
      - "3333:3333"

    environment:
      PORT: 3333
      DATABASE_URL: postgres://docker:docker@db:5432/hackton
      ALLOWED_ORIGINS: http://localhost:5173

    depends_on:
      db:
        condition: service_healthy

    command: sh -c "npx drizzle-kit migrate && npx tsx src/db/seed.ts && npx tsx src/server.ts"

  db:
    image: bitnami/postgresql
    container_name: professor-mensuring-db

    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: hackton

    ports:
      - "5434:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d hackton"]
      interval: 5s
      timeout: 5s
      retries: 5